<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <title>Schedule your tree removal | Charleston Tree Concierge</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #1f2937; background: #f5f3ee; }
    header { background: #1f4d2b; color: #fff; padding: 22px 20px; text-align: center; }
    header a { color: #fff; text-decoration: none; }
    header h1 { margin: 0; font-size: 20px; letter-spacing: .3px; }
    header p { margin: 6px 0 0; font-size: 14px; opacity: .85; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
    h2 { font-size: 17px; margin: 26px 0 4px; }
    .sub { margin: 0 0 12px; font-size: 14px; color: #6b7280; }
    .slot { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid #d6d3cc;
            border-radius: 8px; padding: 14px 16px; margin: 8px 0; font-size: 16px; cursor: pointer; color: #1f2937; }
    .slot:hover, .slot:focus { border-color: #1f4d2b; outline: none; }
    .slot.near { border-left: 5px solid #1f4d2b; }
    .slot small { display: block; color: #1f4d2b; font-size: 13px; margin-top: 3px; }
    .card { background: #fff; border-radius: 8px; padding: 18px; border: 1px solid #d6d3cc; margin-top: 12px; }
    .btn { background: #1f4d2b; color: #fff; border: 0; border-radius: 6px; padding: 12px 20px; font-size: 16px; cursor: pointer; }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn.secondary { background: #fff; color: #1f4d2b; border: 1px solid #1f4d2b; margin-left: 8px; }
    input { width: 100%; font-size: 17px; padding: 12px; border: 1px solid #d6d3cc; border-radius: 6px; margin: 8px 0 12px; }
    .err { color: #9b1c1c; }
    .muted { color: #6b7280; font-size: 14px; }
    footer { text-align: center; font-size: 13px; color: #6b7280; padding: 0 16px 30px; }
    footer a { color: #1f4d2b; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">Charleston Tree Concierge</a></h1>
    <p>Schedule your tree removal</p>
  </header>
  <main>
    <div id="view"><p class="muted">Loading…</p></div>
  </main>
  <footer><a href="/">charlestontreeconcierge.com</a></footer>

  <script>
    // The booking system (Google Apps Script). The page talks to it in the
    // background with no Google sign-in, so it works for everyone.
    var API = 'https://script.google.com/macros/s/AKfycbxSWRZ4BhY6b1e9G1iUVww__vu-XmXzydF4KksEalXo-VU7w2PVR6_xSMIfWXq_LYcfYw/exec';
    var PHONE = '(843) 300-9302';

    var code = (new URLSearchParams(location.search).get('j') || '').replace(/[^a-z0-9]/gi, '');
    var view = document.getElementById('view');

    function api(params) {
      var q = Object.keys(params).map(function (k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      }).join('&');
      return fetch(API + '?' + q + '&t=' + Date.now(), { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        });
    }

    function el(tag, attrs, text) {
      var e = document.createElement(tag);
      if (attrs) Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function show(nodes) {
      view.innerHTML = '';
      nodes.forEach(function (n) { view.appendChild(n); });
      window.scrollTo(0, 0);
    }
    function message(text, isError) {
      show([el('p', { class: isError ? 'err' : 'muted' }, text)]);
    }
    function failed() {
      message('Something went wrong. Please refresh the page, or call/text ' + PHONE + '.', true);
    }

    function askPhone(errorText) {
      var input = el('input', { type: 'tel', placeholder: '(843) 555-0123', autocomplete: 'tel' });
      var btn = el('button', { class: 'btn' }, 'Find my booking');
      var nodes = [el('p', null, 'Enter the phone number you booked with.'), input, btn];
      if (errorText) nodes.push(el('p', { class: 'err' }, errorText));
      show(nodes);
      btn.onclick = function () {
        btn.disabled = true;
        btn.textContent = 'Looking…';
        api({ api: 'lookup', phone: input.value })
          .then(function (r) {
            if (r.error) return askPhone(r.error);
            code = r.code;
            history.replaceState(null, '', '?j=' + code);
            load();
          })
          .catch(function () { askPhone('Something went wrong. Please try again.'); });
      };
    }

    function load() {
      message('Finding the best dates for you…');
      api({ api: 'options', j: code }).then(render).catch(failed);
    }

    function render(r) {
      if (r.error) return message(r.error, true);
      var phone = r.phone || PHONE;
      var nodes = [el('p', null, 'Hi ' + (r.firstName || 'there') + '!')];
      if (r.current) {
        nodes.push(el('div', { class: 'card' }, "You're booked for " + r.current + '.'));
        if (r.locked) {
          nodes.push(el('p', { class: 'muted' }, 'Your removal is coming up soon. To change it, call or text ' + phone + '.'));
          return show(nodes);
        }
        nodes.push(el('p', { class: 'muted' }, 'Need a different time? Pick one below.'));
      }
      var nearby = r.nearby || [], open = r.open || [];
      if (nearby.length) {
        nodes.push(el('h2', null, "We'll already be near you"));
        nodes.push(el('p', { class: 'sub' }, 'These times are first because our crew is booked close by.'));
        nearby.forEach(function (s) {
          var b = el('button', { class: 'slot near' }, s.label);
          b.appendChild(el('small', null, 'Crew about ' + s.miles + ' mi away'));
          b.onclick = function () { confirmSlot(s); };
          nodes.push(b);
        });
      }
      if (open.length) {
        nodes.push(el('h2', null, nearby.length ? 'Other open times' : 'Open times'));
        open.forEach(function (s) {
          var b = el('button', { class: 'slot' }, s.label);
          b.onclick = function () { confirmSlot(s); };
          nodes.push(b);
        });
      }
      if (!nearby.length && !open.length) {
        nodes.push(el('p', { class: 'err' }, 'All removal times are full. Call or text ' + phone + ' and we will fit you in.'));
      }
      nodes.push(el('p', { class: 'muted' }, 'Questions? Call or text ' + phone + '.'));
      show(nodes);
    }

    function confirmSlot(s) {
      var yes = el('button', { class: 'btn' }, 'Confirm');
      var back = el('button', { class: 'btn secondary' }, 'Back');
      var row = el('div');
      row.appendChild(yes); row.appendChild(back);
      show([el('div', { class: 'card' }, 'Book your tree removal for ' + s.label + '?'), el('p'), row]);
      back.onclick = load;
      yes.onclick = function () {
        yes.disabled = true; back.disabled = true;
        yes.textContent = 'Booking…';
        api({ api: 'book', j: code, slot: s.key })
          .then(function (r) {
            if (r.error) return retry(r.error);
            show([
              el('h2', null, "You're all set!"),
              el('div', { class: 'card' }, 'Tree removal: ' + r.label),
              el('p', { class: 'muted' }, 'A confirmation email is on its way. Please have ornaments and lights off the tree before we arrive.'),
              el('p', { class: 'muted' }, 'Need to change it later? Use the same link, or call/text ' + PHONE + '.')
            ]);
          })
          .catch(function () { retry('Something went wrong. Please try again.'); });
      };
    }

    function retry(text) {
      show([el('p', { class: 'err' }, text)]);
      setTimeout(load, 2500);
    }

    if (code) load(); else askPhone();
  </script>
</body>
</html>
